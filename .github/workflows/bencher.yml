# bencher.yml
#
# benchmark `s4` and report to Bencher
#
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
---
name: Bencher
on:  # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      BENCHER_RUN_KEY:
        required: true
  workflow_dispatch:  # yamllint disable-line rule:empty-values
permissions:
  contents: read
env:
  BENCHER_PROJECT: super-speedy-syslog-searcher
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: warn
  HYPERFINE_INSTALL: "/home/runner/.local/bin/hyperfine"
  DIROUT: /tmp/bencher-out
  BENCHER_REPORT: ./bencher-report.json
  HYPERFINE_VERSION: v2.0.0
  S4_BUILD_PRINT: 1
  S4_BUILD_REGEX_PRINT: 1
  RUST_BACKTRACE: 1
  # MSRV
  # should match `rust.yml:env:MSRV_UPLOAD`
  MSRV_UPLOAD: 1.99.1
  S4R: ./s4_release

jobs:

  job_bencher:
    name: Bencher
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Install Hyperfine ${{ env.HYPERFINE_VERSION }}
        shell: bash
        run: |
          set -eux pipefail
          chmod -v +x ./.github/tools/hyperfine-install.sh
          ./.github/tools/hyperfine-install.sh
      - name: Install libsystemd
        shell: bash
        run: |
          set -eux
          chmod -v +x ./.github/tools/libsystemd-install.sh
          ./.github/tools/libsystemd-install.sh
      - name: Add swap file for memory-intensive build
        shell: bash
        run: |
          SWAPFILE=/swapfile_16GB
          set -euxo pipefail
          # show memory and disk usage before
          df -h /
          swapon --show
          # create the swap file
          sudo install -m 0600 /dev/null ${SWAPFILE}
          sudo dd if=/dev/zero of=${SWAPFILE} bs=1M count=16384 status=progress
          sudo mkswap ${SWAPFILE}
          sudo swapon ${SWAPFILE}
          # show memory and disk usage after
          swapon --show
          free -htvw
          df -h /
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.MSRV_UPLOAD }}
      - name: Build release using toolchain ${{ env.MSRV_UPLOAD }}, all regex
        timeout-minutes: 120
        shell: bash
        run: |
          set -euxo pipefail
          unset S4_BUILD_REGEX
          cargo --version
          /usr/bin/time --verbose -- cargo build --locked --profile release --bin s4
          cp -av ./target/release/s4 "${S4R}"
          chmod -v 0555 "${S4R}"
          "${S4R}" --version
          # just curious current memory looks like after the build
          swapon --show
          free -htvw
      - name: Hyperfine benchmarks and create Bencher report
        shell: bash
        run: |
          set -euxo pipefail
          chmod -v +x ./tools/bencher-hyperfine-runs.sh
          PROGRAM="${S4R}" DIROUT="${{ env.DIROUT }}" ./tools/bencher-hyperfine-runs.sh
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            ${{ env.DIROUT }}/*
            ${{ env.BENCHER_REPORT }}
      - name: Send Bencher Report to Bencher API
        shell: bash
        env:
          BENCHER_RUN_KEY: ${{ secrets.BENCHER_RUN_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BENCHER_RUN_KEY}" ]]; then
            echo "::error::BENCHER_RUN_KEY repository secret is required" >&2
            exit 1
          fi
          bash ./tools/bencher-report-upload.sh "${BENCHER_REPORT}"
...
